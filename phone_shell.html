<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="架空のアーカイブ。登場する事件・人物・地名はすべてフィクションです。">
<meta name="robots" content="noindex">
<title>声は壁を透して</title>
<script src="os.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400&family=IBM+Plex+Mono:wght@300;400&display=swap');

:root {
  --bg:       #0c0c0f;
  --s1:       #131318;
  --s2:       #1b1b24;
  --s3:       #23232f;
  --s4:       #2c2c3a;
  --bd:       rgba(255,255,255,0.07);
  --bd2:      rgba(255,255,255,0.13);
  --t1:       #e2e0da;
  --t2:       #86849a;
  --t3:       #46445c;
  --gold:     #c8a96e;
  --gold-d:   rgba(200,169,110,0.14);
  --red:      #c85858;
  --red-d:    rgba(200,88,88,0.12);
  --blue:     #5a8fd4;
  --blue-d:   rgba(90,143,212,0.14);
  --green:    #5aad7a;
  --mono:     'IBM Plex Mono', monospace;
  --sans:     'Noto Sans JP', sans-serif;
  --serif:    'Noto Serif JP', serif;
  --pw:       390px;
  --ph:       844px;
  --pr:       48px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html,body{
  width:100%;height:100%;
  background:#050508;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);
  overflow:hidden;
}

/* ══ 電話フレーム ══════════════════════ */
#phone{
  width:var(--pw);height:var(--ph);
  background:var(--bg);
  border-radius:var(--pr);
  border:1px solid rgba(255,255,255,0.11);
  box-shadow:0 0 0 1px rgba(0,0,0,0.8),0 40px 80px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.07);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}

/* ダイナミックアイランド */
#island{
  position:absolute;top:13px;left:50%;transform:translateX(-50%);
  width:120px;height:34px;
  background:#000;border-radius:20px;
  z-index:300;
  transition:width .45s cubic-bezier(.16,1,.3,1),height .45s cubic-bezier(.16,1,.3,1);
  overflow:hidden;
}
#island.exp{ width:320px;height:66px; }
#island-inner{
  display:none;
  padding:10px 16px;
  gap:10px;
  align-items:center;
}
#island.exp #island-inner{ display:flex; }
#island-avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--s3);border:1px solid var(--bd2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
#island-text{ flex:1;min-width:0; }
#island-name{
  font-family:var(--mono);font-size:10px;color:var(--t2);
  letter-spacing:.08em;margin-bottom:2px;
}
#island-msg{
  font-size:11px;color:var(--t1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:.03em;
}

/* ステータスバー */
#sbar{
  height:56px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 28px 10px;flex-shrink:0;position:relative;z-index:100;
}
#sbar .t{font-family:var(--mono);font-size:15px;color:var(--t1);}
#sbar .ic{display:flex;gap:6px;align-items:center;}
#sbar .ic svg{fill:var(--t1);}

/* スクリーン */
#screen{flex:1;position:relative;overflow:hidden;}

/* ホームインジケーター */
#hind{
  height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#hind div{
  width:130px;height:5px;
  background:rgba(255,255,255,0.22);border-radius:3px;
  cursor:pointer;transition:background .2s;
}
#hind div:hover{background:rgba(255,255,255,0.38);}

/* ══ ホーム画面 ═══════════════════════ */
#home{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .3s;
  overflow-y:auto;scrollbar-width:none;
}
#home::-webkit-scrollbar{display:none;}
#home.hidden{transform:scale(.93);opacity:0;pointer-events:none;}

#wallpaper{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 25% 20%,rgba(35,25,75,.65) 0%,transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 75%,rgba(15,35,55,.55) 0%,transparent 60%),
    var(--bg);
  z-index:0;
}
#wallpaper::after{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");
  opacity:.7;
}

/* 時計ウィジェット */
#clk{
  position:relative;z-index:1;
  text-align:center;padding:36px 0 24px;
}
#clk-time{
  font-family:var(--mono);font-size:68px;font-weight:300;
  color:var(--t1);letter-spacing:-.02em;line-height:1;
  text-shadow:0 2px 20px rgba(0,0,0,.5);
}
#clk-date{font-family:var(--mono);font-size:13px;color:var(--t2);margin-top:6px;letter-spacing:.06em;}
#clk-anom{
  font-family:var(--mono);font-size:10px;color:var(--red);
  margin-top:5px;letter-spacing:.1em;opacity:0;transition:opacity .6s;
}
#clk-anom.vis{opacity:1;}

/* アプリグリッド（4アプリ） */
#grid{
  position:relative;z-index:1;
  display:flex;justify-content:center;gap:18px;
  padding:40px 0 20px;
  flex-wrap:wrap;
}

.aico{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.aico:active .aibox{transform:scale(.88);}

.aibox{
  width:72px;height:72px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
  border:1px solid var(--bd);
  transition:transform .15s;
  position:relative;
}
.ailabel{
  font-size:11px;color:var(--t1);
  text-shadow:0 1px 4px rgba(0,0,0,.8);
  letter-spacing:.03em;
}

/* ★v3.1 解析アプリ用グリッド */
#tool-grid{
  position:relative;z-index:1;
  display:flex;justify-content:center;flex-wrap:wrap;gap:28px;
  padding:8px 24px 30px;
}
#tool-grid:empty{display:none;}
/* ツールアイコンの外観（解析アプリらしい配色） */
.tool-icon{
  background:linear-gradient(135deg,#1a2438 0%,#0d141f 100%);
}
/* 新規インストール時のポップイン演出 */
@keyframes toolPopIn{
  0%   { transform:scale(0); opacity:0; }
  60%  { transform:scale(1.18); opacity:1; }
  100% { transform:scale(1); opacity:1; }
}
@keyframes toolFlash{
  0%   { box-shadow:0 0 0 0 rgba(200,169,110,0); }
  30%  { box-shadow:0 0 22px 4px rgba(200,169,110,.75); }
  100% { box-shadow:0 0 0 0 rgba(200,169,110,0); }
}
.tool-icon.popin{ animation:toolPopIn .5s cubic-bezier(.16,1,.3,1); }
.tool-icon.flash{ animation:toolFlash 1.1s ease; }

/* 通知バッジ */
.nbadge{
  position:absolute;top:-5px;right:-5px;
  background:var(--red);color:#fff;
  font-family:var(--mono);font-size:9px;
  min-width:17px;height:17px;border-radius:9px;
  display:none;align-items:center;justify-content:center;
  padding:0 3px;border:1.5px solid var(--bg);
}
.nbadge.vis{display:flex;}

/* ═══ アプリ画面 ══════════════════════ */
#appscr{
  position:absolute;inset:0;
  background:var(--s1);
  transform:translateY(102%);
  transition:transform .45s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;z-index:50;
}
#appscr.open{transform:translateY(0);}

/* アプリナビバー */
#anav{
  height:54px;display:flex;align-items:center;
  padding:0 16px;gap:10px;
  border-bottom:1px solid var(--bd);flex-shrink:0;
  background:var(--s1);
}
#anav-back{color:var(--blue);font-size:15px;cursor:pointer;padding:8px;margin-left:-8px;user-select:none;}
#anav-back:hover{opacity:.7;}
#anav-title{flex:1;font-size:16px;font-weight:500;color:var(--t1);text-align:center;letter-spacing:.02em;}
#anav-r{width:40px;}

#acontent{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#acontent::-webkit-scrollbar{display:none;}

/* ═══ ブラウザ ════════════════════════ */
#bbar{
  display:flex;align-items:center;padding:9px 12px;gap:8px;
  border-bottom:1px solid var(--bd);flex-shrink:0;
  background:var(--s1);
}
#burl{
  flex:1;background:var(--s3);border:1px solid var(--bd);border-radius:10px;
  padding:7px 12px;font-family:var(--mono);font-size:12px;
  color:var(--t1);outline:none;letter-spacing:.03em;transition:border-color .2s;
}
#burl:focus{border-color:var(--bd2);}
#burl::placeholder{color:var(--t3);}
#bgo{
  background:var(--gold-d);border:1px solid rgba(200,169,110,.28);
  border-radius:8px;padding:7px 14px;
  font-family:var(--mono);font-size:12px;color:var(--gold);
  cursor:pointer;letter-spacing:.05em;white-space:nowrap;transition:background .2s;
}
#bgo:hover{background:rgba(200,169,110,.24);}
/* 戻る・進むボタン */
#bnav-btns{
  display:flex;gap:4px;
}
.bnav-btn{
  width:30px;height:30px;border-radius:8px;
  background:var(--s3);border:1px solid var(--bd);
  color:var(--t2);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .15s;user-select:none;
  flex-shrink:0;
}
.bnav-btn:hover{background:var(--s4);}
.bnav-btn:disabled,.bnav-btn[disabled]{opacity:.3;pointer-events:none;}

/* ブラウザコンテンツ枠 */
#bview{flex:1;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#bview::-webkit-scrollbar{display:none;}

/* 検索結果ボックス */
.sbox{
  margin:12px 16px;border-radius:12px;padding:14px 16px;
  background:var(--s2);border:1px solid var(--bd);
}
.sbox.ok{border-color:rgba(90,173,122,.35);}
.sbox.ng{border-color:rgba(200,88,88,.28);}
.sbox-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;margin-bottom:6px;}
.sbox.ok .sbox-label{color:var(--green);}
.sbox.ng .sbox-label{color:var(--red);}
.sbox-desc{font-size:12px;color:var(--t2);line-height:1.7;letter-spacing:.02em;}
.sbox-link{
  display:inline-block;margin-top:10px;
  font-family:var(--mono);font-size:11px;color:var(--gold);
  cursor:pointer;letter-spacing:.06em;
}
.sbox-link:hover{opacity:.7;}

/* ─ ブラウザページ内コンテンツ ─ */
.bpage{padding:22px 20px 48px;}
.bpage-num{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:.12em;margin-bottom:8px;}
.bpage-title{font-family:var(--serif);font-size:20px;color:var(--t1);line-height:1.4;letter-spacing:.04em;margin-bottom:6px;}
.bpage-meta{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:.07em;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bd);}
.bpage-body{font-family:var(--serif);font-size:14px;color:var(--t1);line-height:2.1;letter-spacing:.06em;}
.bpage-body p{margin-bottom:1.4em;}
.bpage-body .red{background:var(--t1);color:var(--t1);border-radius:2px;padding:0 2px;user-select:none;}
.bpage-body .anom{color:var(--red);font-family:var(--mono);font-size:12px;letter-spacing:.06em;}

/* ═══ インストールモーダル（★v3.1） ════ */
#install-modal{
  position:absolute;inset:0;z-index:400;
  background:rgba(5,5,8,.78);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(3px);
}
#install-modal.open{display:flex;animation:fadeUp .25s ease;}
#install-card{
  width:280px;background:var(--s1);
  border:1px solid var(--bd2);border-radius:18px;
  padding:26px 22px 22px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
#install-icon{
  font-size:42px;margin-bottom:12px;
  display:inline-block;
}
#install-name{
  font-family:var(--serif);font-size:16px;color:var(--t1);
  letter-spacing:.04em;margin-bottom:4px;
}
#install-status{
  font-family:var(--mono);font-size:10px;color:var(--t3);
  letter-spacing:.08em;margin-bottom:18px;
}
#install-bar-track{
  height:5px;background:var(--s3);border-radius:3px;overflow:hidden;
}
#install-bar-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--gold),#e0c590);
  border-radius:3px;transition:width .12s linear;
}

/* ═══ 誰のスマホか 導入オーバーレイ ══ */
#intro-overlay{
  position:absolute;inset:0;z-index:500;
  background:#080610;
  display:none;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;
  transition:opacity .7s ease;
}
#intro-overlay.show{display:flex;}
#intro-overlay.fadeout{opacity:0;pointer-events:none;}
#intro-inner{
  text-align:center;padding:0 28px;font-family:var(--mono);
}
#intro-status{
  font-size:9px;color:rgba(200,88,88,.7);
  letter-spacing:.25em;margin-bottom:36px;
  text-transform:uppercase;
}
#intro-msg{
  font-size:14px;color:var(--t1);
  line-height:2.4;letter-spacing:.04em;margin-bottom:44px;
}
#intro-sub{
  font-size:9px;color:var(--t3);letter-spacing:.14em;
  animation:pulse-sub 2.2s ease infinite;
}
@keyframes pulse-sub{0%,100%{opacity:.35;}50%{opacity:.9;}}

/* ═══ メッセージアプリ ════════════════ */
.mthread{
  display:flex;align-items:center;padding:13px 16px;gap:12px;
  border-bottom:1px solid var(--bd);cursor:pointer;transition:background .14s;
}
.mthread:hover{background:var(--s2);}
.mthread.locked{opacity:.35;pointer-events:none;}
.mthread-av{
  width:46px;height:46px;border-radius:50%;
  background:var(--s3);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.mthread-body{flex:1;min-width:0;}
.mthread-name{font-size:14px;font-weight:500;color:var(--t1);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mthread-prev{font-size:12px;color:var(--t2);margin-top:2px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mthread-meta{font-family:var(--mono);font-size:10px;color:var(--t3);text-align:right;flex-shrink:0;}
.mthread-dot{width:8px;height:8px;background:var(--blue);border-radius:50%;margin:4px auto 0;}

/* ─ メッセージ本文ビュー ─ */
#msgview{
  position:absolute;inset:0;background:var(--s1);
  transform:translateX(102%);transition:transform .4s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;z-index:60;
}
#msgview.open{transform:translateX(0);}
#mvnav{
  height:50px;display:flex;align-items:center;
  padding:0 14px;gap:10px;border-bottom:1px solid var(--bd);
  flex-shrink:0;background:var(--s1);
}
#mvnav-back{color:var(--blue);font-size:15px;cursor:pointer;padding:8px;margin-left:-8px;}
#mvnav-back:hover{opacity:.7;}
#mvnav-title{flex:1;font-size:15px;font-weight:500;color:var(--t1);text-align:center;letter-spacing:.02em;}
#mvcontent{
  flex:1;overflow-y:auto;scrollbar-width:none;padding:16px;
  display:flex;flex-direction:column;gap:14px;
}
#mvcontent::-webkit-scrollbar{display:none;}

.mbubble-row{display:flex;align-items:flex-end;gap:8px;max-width:84%;}
.mbubble-row.me{align-self:flex-end;flex-direction:row-reverse;}
.mbubble-av{
  width:28px;height:28px;border-radius:50%;
  background:var(--s3);border:1px solid var(--bd);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;
}
.mbubble{
  background:var(--s2);border:1px solid var(--bd);
  border-radius:18px 18px 18px 4px;
  padding:10px 14px;font-size:13px;line-height:1.7;
  color:var(--t1);letter-spacing:.03em;
}
.mbubble.me{background:#173060;border-color:#1e3d7a;border-radius:18px 18px 4px 18px;color:#cce0ff;}
.mbubble.anom{background:rgba(200,80,80,.08);border-color:rgba(200,80,80,.3);}
.mbubble-time{font-family:var(--mono);font-size:10px;color:var(--t3);padding:0 4px;margin-top:2px;}
.mbubble-time.anom{color:var(--red);opacity:.7;}
.mdate-sep{
  text-align:center;font-family:var(--mono);font-size:10px;
  color:var(--t3);letter-spacing:.08em;align-self:center;
}

/* ═══ 履歴アプリ ══════════════════════ */
.hrow{
  display:flex;align-items:center;padding:12px 16px;gap:12px;
  border-bottom:1px solid var(--bd);cursor:pointer;transition:background .14s;
}
.hrow:hover{background:var(--s2);}
.hrow-icon{font-size:20px;flex-shrink:0;}
.hrow-body{flex:1;min-width:0;}
.hrow-title{font-size:13px;font-weight:500;color:var(--t1);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hrow-time{font-family:var(--mono);font-size:10px;color:var(--t3);margin-top:2px;}
.hempty{padding:48px 20px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--t3);letter-spacing:.1em;line-height:1.8;}
.hclear{
  margin:10px 16px;
  background:var(--red-d);border:1px solid rgba(200,88,88,.22);
  border-radius:10px;padding:11px;
  font-family:var(--mono);font-size:11px;color:var(--red);
  letter-spacing:.06em;cursor:pointer;text-align:center;transition:background .2s;
}
.hclear:hover{background:rgba(200,88,88,.2);}

/* ═══ アニメーション ══════════════════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

/* ★v3.4 セクタマップ */
@keyframes sectorBlink{0%,100%{opacity:.25;}50%{opacity:1;}}
@keyframes takoGlow{0%,100%{opacity:.7;filter:drop-shadow(0 0 6px rgba(200,169,110,.5));}50%{opacity:1;filter:drop-shadow(0 0 18px rgba(200,169,110,.9));}}
.sector-unread{animation:sectorBlink 2s infinite;}
.tako-complete-svg{animation:takoGlow 2.5s ease infinite;}
.tako-head-true{animation:takoGlow 2.4s ease infinite;}
.tako-wrap{padding:14px 0 20px;}
.tako-status{font-family:var(--mono);font-size:10px;letter-spacing:.08em;margin:0 16px 6px;line-height:1.6;}
.tako-subhead{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:.1em;margin:0 16px 8px;}
.tako-svg-wrap{display:flex;justify-content:center;margin-bottom:4px;}
.tako-list{margin:0 16px;}
.tako-leg-row{border-bottom:1px solid var(--bd);padding:10px 0;cursor:pointer;user-select:none;}
.tako-leg-row:last-child{border-bottom:none;}
.tako-leg-header{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--t1);}
.tako-leg-header.dimmed{color:var(--t3);}
.tako-leg-sectors{margin-top:8px;display:none;flex-direction:column;gap:4px;}
.tako-leg-sectors.open{display:flex;}
.tako-sector-item{font-family:var(--mono);font-size:11px;padding:3px 0 3px 10px;display:flex;align-items:center;gap:6px;}
.tako-foot{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:.06em;line-height:1.9;margin:16px 16px 32px;padding-top:12px;border-top:1px solid var(--bd);}
.tako-complete-note{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.1em;text-align:center;padding:10px 0 4px;}

/* ══ スマートフォン実機対応 ══════════════ */
@media (max-width: 430px) {
  html, body {
    align-items: flex-start;
    justify-content: flex-start;
    background: var(--bg);
  }
  #phone {
    width: 100vw;
    height: 100dvh;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }
  #afooter {
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  #hind {
    padding-bottom: env(safe-area-inset-bottom);
  }
}
</style>
</head>
<body>
<div id="phone">

  <!-- ダイナミックアイランド -->
  <div id="island">
    <div id="island-inner">
      <div id="island-avatar">📡</div>
      <div id="island-text">
        <div id="island-name">送信者不明</div>
        <div id="island-msg"></div>
      </div>
    </div>
  </div>

  <!-- ステータスバー -->
  <div id="sbar">
    <span class="t" id="stime">--:--</span>
    <div class="ic">
      <svg width="16" height="12" viewBox="0 0 16 12">
        <rect x="0" y="8" width="3" height="4" rx=".5" opacity=".4"/>
        <rect x="4" y="5" width="3" height="7" rx=".5" opacity=".7"/>
        <rect x="8" y="2" width="3" height="10" rx=".5"/>
        <rect x="12" y="0" width="3" height="12" rx=".5"/>
      </svg>
      <svg width="22" height="11" viewBox="0 0 22 11">
        <rect x=".5" y=".5" width="18" height="10" rx="2" stroke="white" stroke-width="1" fill="none" opacity=".55"/>
        <rect x="2" y="2" width="11" height="7" rx="1" fill="white"/>
        <path d="M19.5 3.5 L19.5 7.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- スクリーン -->
  <div id="screen">

    <!-- ホーム -->
    <div id="home">
      <div id="wallpaper"></div>

      <div id="clk">
        <div id="clk-time">--:--</div>
        <div id="clk-date">----年--月--日</div>
        <div id="clk-anom">▸ 異常なタイムスタンプを検出</div>
      </div>

      <!-- 4アプリ（固定） -->
      <div id="grid">
        <div class="aico" onclick="Shell.open('browser')">
          <div class="aibox" style="background:linear-gradient(135deg,#162840 0%,#0a1520 100%);">
            🔍
            <div class="nbadge" id="b-browser"></div>
          </div>
          <span class="ailabel">ブラウザ</span>
        </div>
        <div class="aico" onclick="Shell.open('messages')">
          <div class="aibox" style="background:linear-gradient(135deg,#182848 0%,#0d1a30 100%);">
            💬
            <div class="nbadge" id="b-messages"></div>
          </div>
          <span class="ailabel">メッセージ</span>
        </div>
        <div class="aico" onclick="Shell.open('history')">
          <div class="aibox" style="background:linear-gradient(135deg,#1e1a10 0%,#100e08 100%);">
            🕐
            <div class="nbadge" id="b-history"></div>
          </div>
          <span class="ailabel">履歴</span>
        </div>
        <div class="aico" onclick="Shell.open('tako')">
          <div class="aibox" style="background:linear-gradient(135deg,#2a1530 0%,#150a18 100%);">
            🐙
            <div class="nbadge" id="b-tako"></div>
          </div>
          <span class="ailabel">セクタマップ</span>
        </div>
      </div>

      <!-- ★v3.1 解析アプリ（インストール済みを動的描画） -->
      <div id="tool-grid"></div>

      <!-- 免責表示 -->
      <div style="
        padding:12px 20px 16px;
        font-family:var(--mono);
        font-size:9px;
        color:rgba(255,255,255,0.18);
        letter-spacing:.05em;
        line-height:1.7;
        text-align:center;
      ">
        本作はフィクションです。<br>
        登場する事件・地名・人物・団体は実在のものとは関係ありません。
      </div>
    </div><!-- /home -->

    <!-- ═══ アプリ画面 ═══ -->
    <div id="appscr">
      <div id="anav">
        <span id="anav-back" onclick="Shell.closeApp()">‹ ホーム</span>
        <span id="anav-title"></span>
        <span id="anav-r"></span>
      </div>
      <div id="acontent"></div>
      <div id="afooter" style="display:none;flex-shrink:0;border-top:1px solid var(--bd);background:var(--s1);padding:8px 12px calc(8px + env(safe-area-inset-bottom, 0px));gap:8px;"></div>
    </div>

    <!-- ═══ メッセージ本文ビュー ═══ -->
    <div id="msgview">
      <div id="mvnav">
        <span id="mvnav-back" onclick="Shell.closeMsgView()">‹ 戻る</span>
        <span id="mvnav-title"></span>
      </div>
      <div id="mvcontent"></div>
    </div>

    <!-- ★v3.1 インストールモーダル -->
    <div id="install-modal">
      <div id="install-card">
        <div id="install-icon">💾</div>
        <div id="install-name">—</div>
        <div id="install-status">ツールを取得しています…</div>
        <div id="install-bar-track"><div id="install-bar-fill"></div></div>
      </div>
    </div>

    <!-- ★A-4 誰のスマホか導入オーバーレイ（初回起動のみ） -->
    <div id="intro-overlay">
      <div id="intro-inner">
        <div id="intro-status">⚠ RECOVERED DEVICE — OWNER UNKNOWN</div>
        <div id="intro-msg">
          回収された端末のアーカイブを、<br>あなたが開こうとしている。<br>
          <span style="font-size:11px;color:var(--t3);">持ち主：不明</span><br>
          <span style="font-size:11px;color:var(--t3);">最終起動：1973-09-12 09:04</span><br>
          <span style="font-size:11px;color:var(--red);opacity:.65;">接続元：照合できません</span>
        </div>
        <div id="intro-sub">タップして起動</div>
      </div>
    </div>

  </div><!-- /screen -->

  <div id="hind"><div onclick="Shell.goHome()"></div></div>
</div><!-- /phone -->

<script>
/* ═══════════════════════════════════════
   Shell ── UI コントローラー
═══════════════════════════════════════ */
const Shell = (() => {
  let curApp = null;
  let bStack  = [];  // [{id, scrollY}]
  let bPtr    = -1;
  let curTool = null;  // ★v3.1 現在開いている解析アプリ

  /* ── 起動 ── */
  function boot() {
    tick(); setInterval(tick, 10000);
    updateBadges();
    renderToolGrid();
    setTimeout(() => document.getElementById('clk-anom').classList.add('vis'), 900);
    if (KoeOS.isFirstLaunch()) {
      KoeOS.markLaunched();
      const ov = document.getElementById('intro-overlay');
      if (ov) {
        ov.classList.add('show');
        ov.addEventListener('click', () => {
          ov.classList.add('fadeout');
          setTimeout(() => {
            ov.classList.remove('show','fadeout');
            pushNotif('📡', '繧ｿ◆縺薙％??', 'このアーカイブを見つけてください。', 'soran_intro');
          }, 700);
        }, { once: true });
      } else {
        setTimeout(() => pushNotif('📡', '繧ｿ◆縺薙％??', 'このアーカイブを見つけてください。', 'soran_intro'), 1200);
      }
    } else {
      // 既存セーブの再読込：到達済みビートを無音で既配信扱いにし、再トーストを防ぐ
      deliverMessages(false);
      // 旧セーブ移行：_READ_KEY が未初期化の場合のみ、現在可視スレッドを全て既読として初期化
      // （過去にプレイ済みのプレイヤーのバッジが全部未読になるのを防ぐ）
      if (localStorage.getItem(_READ_KEY) === null) {
        const _initRead = new Set(_visibleThreads().map(t => t.id));
        localStorage.setItem(_READ_KEY, JSON.stringify([..._initRead]));
      }
    }
  }

  /* ── 時計 ── */
  function tick() {
    const n = new Date();
    const s = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
    document.getElementById('stime').textContent = s;
    document.getElementById('clk-time').textContent = s;
    const days=['日','月','火','水','木','金','土'];
    document.getElementById('clk-date').textContent =
      `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日（${days[n.getDay()]}）`;
  }

  /* ── バッジ更新 ── */
  function updateBadges() {
    ['browser','messages','history'].forEach(a => {
      const n = (a === 'messages') ? _unreadCount() : KoeOS.getNotif(a);
      const el = document.getElementById('b-'+a);
      if(!el) return;
      el.textContent = n>9?'9+':String(n);
      el.classList.toggle('vis', n>0);
    });
    // ★v3.4 セクタマップバッジ：restored && !viewed（TAKO_LEGS 対象のみ、クリア時は0）
    const elTako = document.getElementById('b-tako');
    if(elTako) {
      const isClear = KoeOS.isViewed('epilogue') && (localStorage.getItem('koe_fumi_note')||'').trim() !== '';
      let takoUnread = 0;
      if(!isClear) {
        for(const leg of KoeOS.TAKO_LEGS) {
          for(const pid of leg.pages) {
            if(KoeOS.isRestored(pid) && !KoeOS.isViewed(pid)) takoUnread++;
          }
        }
      }
      elTako.textContent = takoUnread>9?'9+':String(takoUnread);
      elTako.classList.toggle('vis', takoUnread>0);
    }
  }

  /* ═══════════════════════════════════
     ★v3.1 解析アプリ（ホーム動的描画 / インストール / 起動）
  ═══════════════════════════════════ */
  function renderToolGrid() {
    const grid = document.getElementById('tool-grid');
    if(!grid) return;
    const installed = [...KoeOS.getInstalled()];
    grid.innerHTML = installed.map(id => {
      const a = KoeOS.getToolApp(id);
      if(!a) return '';
      return `<div class="aico" onclick="Shell.openTool('${a.id}')">
        <div class="aibox tool-icon" data-toolicon="${a.id}">${a.icon}</div>
        <span class="ailabel">${a.name}</span>
      </div>`;
    }).join('');
  }

  /* 新規インストールアイコンのポップイン＋フラッシュ */
  function flashNewIcon(id) {
    const el = document.querySelector(`[data-toolicon="${id}"]`);
    if(!el) return;
    el.classList.add('popin','flash');
    setTimeout(() => el.classList.remove('popin','flash'), 1200);
  }

  /* インストール演出フロー */
  function installTool(id) {
    const app = KoeOS.getToolApp(id);
    if(!app || KoeOS.isInstalled(id)) return;

    // モーダル表示
    const modal = document.getElementById('install-modal');
    const fill  = document.getElementById('install-bar-fill');
    document.getElementById('install-icon').textContent = app.icon;
    document.getElementById('install-name').textContent = app.name;
    document.getElementById('install-status').textContent = 'ツールを取得しています…';
    fill.style.width = '0%';
    modal.classList.add('open');

    // プログレス（約2秒）
    let pct = 0;
    const iv = setInterval(() => {
      pct += Math.random()*14 + 6;
      if(pct >= 100) { pct = 100; clearInterval(iv); }
      fill.style.width = pct + '%';
      if(pct >= 100) {
        document.getElementById('install-status').textContent = 'インストール完了';
      }
    }, 130);

    setTimeout(() => {
      KoeOS.installApp(id);
      modal.classList.remove('open');
      loadToolScript(`tools/${id}.js`).then(() => {
        // ホームへ戻してアイコンをポップイン
        goHome();
        renderToolGrid();
        setTimeout(() => flashNewIcon(id), 60);
        pushNotif(app.icon, 'アプリ', `${app.name} をインストールしました`, null);
      });
    }, 2100);
  }

  /* 解析アプリを開く（第4の画面種別） */
  function openTool(id) {
    const app = KoeOS.getToolApp(id);
    if(!app || !KoeOS.isInstalled(id)) return;
    curApp = null;
    curTool = id;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('appscr').classList.add('open');
    document.getElementById('anav-title').textContent = app.name;

    // ブラウザバー残骸を除去
    const old = document.getElementById('bbar-wrap');
    if(old) old.remove();

    const footer = document.getElementById('afooter');
    footer.style.display = 'none';
    footer.innerHTML = '';

    const content = document.getElementById('acontent');
    content.style.display = 'block';
    content.style.overflow = 'auto';
    content.innerHTML = (typeof TOOL_UI !== 'undefined' && TOOL_UI[id])
      ? TOOL_UI[id]()
      : `<div style="padding:40px 20px;font-family:var(--mono);font-size:11px;color:var(--t3);text-align:center;">ツールを読み込めませんでした</div>`;
  }

  /* ── プッシュ通知（ダイナミックアイランド） ── */
  function pushNotif(emoji, name, msg, threadId) {
    const isl  = document.getElementById('island');
    const av   = document.getElementById('island-avatar');
    const nm   = document.getElementById('island-name');
    const txt  = document.getElementById('island-msg');
    av.textContent = emoji;
    nm.textContent = name;
    txt.textContent = msg;
    isl.classList.add('exp');
    if(threadId) {
      isl.style.cursor = 'pointer';
      isl.onclick = () => { Shell.open('messages'); Shell.openThread(threadId); };
    }
    setTimeout(() => {
      isl.classList.remove('exp');
      isl.style.cursor = '';
      isl.onclick = null;
    }, 4500);
    updateBadges();
  }

  /* ── アプリを開く ── */
  function open(appId) {
    curApp = appId;
    curTool = null;
    // メッセージのスレッド上のボタンから他appへ遷移した際、msgviewが残って
    // 「押しても何も起きない」ように見えるのを防ぐ（遷移先を可視化）
    const _mv = document.getElementById('msgview');
    if(_mv) _mv.classList.remove('open');
    document.getElementById('home').classList.add('hidden');
    document.getElementById('appscr').classList.add('open');
    KoeOS.clearNotif(appId);
    updateBadges();

    const titles = { browser:'ブラウザ', messages:'メッセージ', history:'履歴', tako:'セクタマップ' };
    document.getElementById('anav-title').textContent = titles[appId] || appId;

    const old = document.getElementById('bbar-wrap');
    if(old) old.remove();

    const content = document.getElementById('acontent');
    content.innerHTML = '';

    const footer = document.getElementById('afooter');
    footer.style.display = 'none';
    footer.innerHTML = '';

    if(appId === 'browser') renderBrowser();
    else if(appId === 'messages') renderMessages(content);
    else if(appId === 'history') renderHistory(content);
    else if(appId === 'tako') _renderTako(content);
  }

  /* ── アプリを閉じる ── */
  function closeApp() {
    document.getElementById('appscr').classList.remove('open');
    document.getElementById('home').classList.remove('hidden');
    curApp = null;
    curTool = null;
    renderToolGrid();   // ★v3.1 戻ったとき最新状態に
    updateBadges();
  }

  function goHome() { closeMsgView(); closeApp(); }

  /* ═══════════════════════════════════
     ★v3.1 検索欄に語を入れてフォーカス（telegram_001 のキーワードタグ用）
  ═══════════════════════════════════ */
  function setSearchAndFocus(kw) {
    open('browser');
    setTimeout(() => {
      const inp = document.getElementById('burl');
      if(inp) { inp.value = kw; inp.focus(); }
    }, 120);
  }

  /* ═══════════════════════════════════
     ブラウザ
  ═══════════════════════════════════ */
  function renderBrowser(pageId) {
    const content = document.getElementById('acontent');
    content.innerHTML = '';

    const barHTML = `
      <div id="bbar-wrap" style="display:flex;flex-direction:column;flex-shrink:0;">
        <div id="bbar" style="display:flex;align-items:center;padding:9px 12px;gap:7px;border-bottom:1px solid var(--bd);background:var(--s1);">
          <div class="bnav-btn" id="bbtn-back" onclick="Shell.bBack()" title="戻る">‹</div>
          <div class="bnav-btn" id="bbtn-fwd"  onclick="Shell.bFwd()"  title="進む">›</div>
          <input id="burl" placeholder="キーワードを入力して検索…" style="flex:1;background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:7px 11px;font-family:var(--mono);font-size:12px;color:var(--t1);outline:none;letter-spacing:.03em;" />
          <button id="bgo" onclick="Shell.doSearch()" style="background:var(--gold-d);border:1px solid rgba(200,169,110,.28);border-radius:8px;padding:7px 13px;font-family:var(--mono);font-size:12px;color:var(--gold);cursor:pointer;letter-spacing:.05em;white-space:nowrap;">検索</button>
        </div>
        <div id="bsearch-result" style="display:none;padding:10px 14px;"></div>
      </div>
    `;
    content.insertAdjacentHTML('beforeend', barHTML);

    const bview = document.createElement('div');
    bview.id = 'bview';
    bview.style.cssText = 'flex:1;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;';
    content.appendChild(bview);
    content.style.display = 'flex';
    content.style.flexDirection = 'column';
    content.style.overflow = 'hidden';

    const _burlEl = document.getElementById('burl');
    _burlEl.addEventListener('keydown', e => { if(e.key==='Enter') Shell.doSearch(); });
    _burlEl.addEventListener('focus',   () => { _burlEl.select(); });

    if(pageId) {
      _loadPage(pageId);
    } else {
      _renderBrowserHome(bview);
      bStack = [{ id: '__home', scrollY: 0 }];
      bPtr   = 0;
      _updateNavBtns();
    }
  }

  function _renderBrowserHome(bview) {
    const restored = KoeOS.PAGES.filter(p => KoeOS.isRestored(p.id));
    const restoredRows = restored.length === 0 ? '' : `
      <div style="width:100%;max-width:320px;margin-top:24px;">
        <div style="font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:.15em;margin-bottom:10px;">── 復元済みファイル（${restored.length}件）</div>
        <div style="background:var(--s2);border:1px solid var(--bd);border-radius:12px;overflow:hidden;">
          ${restored.map(p => `
            <div onclick="Shell.bNavigate('${p.id}')" style="
              display:flex;align-items:center;gap:10px;
              padding:10px 14px;
              border-bottom:1px solid rgba(255,255,255,0.04);
              cursor:pointer;
            ">
              <span style="flex-shrink:0;font-size:16px;">${p.icon}</span>
              <span style="flex:1;font-family:var(--mono);font-size:11px;color:var(--t1);letter-spacing:.03em;">${p.title}</span>
              <span style="color:var(--t3);font-size:12px;">›</span>
            </div>
          `).join('')}
        </div>
      </div>`;

    bview.innerHTML = `
      <div style="padding:40px 20px 32px;display:flex;flex-direction:column;align-items:center;gap:0;">
        <div style="font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:.2em;margin-bottom:28px;">── 記録躯体　接続済み ──</div>
        <div style="font-family:var(--serif);font-size:28px;color:var(--t1);letter-spacing:.08em;margin-bottom:8px;text-align:center;line-height:1.3;">声は壁を透して</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--t2);letter-spacing:.06em;text-align:center;line-height:1.9;margin-bottom:32px;">
          記録されなかったものを、復元する。<br>
          キーワードを入力してください。
        </div>
        <div style="width:100%;max-width:320px;background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:20px 18px;">
          <div style="font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:.15em;margin-bottom:12px;">使い方</div>
          <div style="font-size:12px;color:var(--t2);line-height:1.9;letter-spacing:.04em;font-family:var(--serif);">
            アーカイブ各所に散らばったキーワードを見つけ、上部の入力欄に入力してください。一致すると封鎖されたページが復元されます。
          </div>
        </div>
        <div style="width:100%;max-width:320px;margin-top:14px;font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:.08em;display:flex;justify-content:space-between;">
          <span>セクタ固定率：<span style="color:var(--gold);">${KoeOS.getFixedPercent()}%</span></span>
          <span style="color:rgba(200,88,88,.6);">損耗進行中</span>
        </div>
        ${restoredRows}
      </div>`;
  }

  function bNavigate(pageId) {
    if(bPtr < bStack.length-1) bStack = bStack.slice(0, bPtr+1);
    bStack.push({ id: pageId, scrollY: 0 });
    bPtr = bStack.length - 1;
    _loadPage(pageId);
    _updateNavBtns();
  }

  function bBack() {
    if(bPtr <= 0) return;
    const bview = document.getElementById('bview');
    if(bview) bStack[bPtr].scrollY = bview.scrollTop;
    bPtr--;
    const entry = bStack[bPtr];
    if(entry.id === '__home') _renderBrowserHome(bview||document.getElementById('bview'));
    else _loadPage(entry.id, entry.scrollY);
    _updateNavBtns();
  }

  function bFwd() {
    if(bPtr >= bStack.length-1) return;
    bPtr++;
    const entry = bStack[bPtr];
    const bview = document.getElementById('bview');
    if(entry.id === '__home') _renderBrowserHome(bview);
    else _loadPage(entry.id, entry.scrollY);
    _updateNavBtns();
  }

  function _updateNavBtns() {
    const bb = document.getElementById('bbtn-back');
    const bf = document.getElementById('bbtn-fwd');
    if(bb) { bb.style.opacity = bPtr<=0?'.3':'1'; bb.style.pointerEvents = bPtr<=0?'none':'auto'; }
    if(bf) { bf.style.opacity = bPtr>=bStack.length-1?'.3':'1'; bf.style.pointerEvents = bPtr>=bStack.length-1?'none':'auto'; }
  }

  function _loadPage(pageId, scrollY=0) {
    const bview = document.getElementById('bview');
    if(!bview) return;
    const urlEl = document.getElementById('burl');
    if(urlEl) urlEl.value = 'archive://' + pageId;

    KoeOS.addHistory(pageId);

    const page = KoeOS.getPage(pageId);
    if(!page) { bview.innerHTML = '<div style="padding:40px 20px;font-family:var(--mono);font-size:11px;color:var(--t3);text-align:center;">ページが見つかりません</div>'; return; }
    KoeOS.markRestored(pageId);
    const _newIds = KoeOS.checkPrereqUnlocks();

    if (!PAGE_CONTENT[pageId]) _scripts.push(`pages/${pageId}.js`);

      deliverMessages(true);

  /* ─ 検索・キーワード ─ */
  function doSearch() {
    const inp = document.getElementById('burl');
    if(!inp) return;
    const val = inp.value.trim();
    if(val.startsWith('archive://')) {
      const id = val.replace('archive://','');
      if(KoeOS.getPage(id) && KoeOS.isRestored(id)) { bNavigate(id); return; }
    }
    if(!val) return;

    const _before = KoeOS.getSpokeProgress();
    const res = KoeOS.submitKeyword(val);
    const rbox = document.getElementById('bsearch-result');
    if(!rbox) return;
    rbox.style.display = 'block';

    if(res.alreadyUsed) {
      rbox.innerHTML = `<div class="sbox ng"><div class="sbox-label">登録済み</div><div class="sbox-desc">このキーワードは既に使用されています。</div></div>`;
      setTimeout(() => { if(rbox) rbox.style.display='none'; }, 3500);
      return;
    }
    let hideAfter = 3500;
    if(res.success) {
      const pages = res.unlocked.map(id=>KoeOS.getPage(id)).filter(Boolean);
      const titles = pages.map(p=>p.title).join('、');
      rbox.innerHTML = `<div class="sbox ok">
        <div class="sbox-label">── 復元完了 ──</div>
        <div class="sbox-desc">「${titles}」へのアクセスが復元されました。</div>
        <div class="sbox-link" onclick="Shell.bNavigate('${res.unlocked[0]}')">▸ 開く</div>
      </div>`;
      inp.value = '';
      // スポーク完了ナッジ：今回の検索で新たに complete になったスポークがあれば通知
      const SPOKE_NAMES = { A:'手記', B:'写真', C:'掲示板', D:'地図', E:'電文' };
      const _after = KoeOS.getSpokeProgress();
      const _newlyCompleted = _after.filter(s => s.complete && !_before.find(b => b.group === s.group && b.complete));
      if (_newlyCompleted.length > 0) {
        const g = _newlyCompleted[0].group;
        const remaining = _after.filter(s => !s.complete).map(s => SPOKE_NAMES[s.group]);
        if (remaining.length > 0) {
          pushNotif('📡', '繧ｿ◆縺薙％??', `${SPOKE_NAMES[g]}の照合が完了。未照合：${remaining.join('、')}`, null);
        }
      }
      Promise.all(res.unlocked.map(id => loadPageScript(`pages/${id}.js`))).then(() => {
        deliverMessages(true);
        const bv = document.getElementById('bview');
        if(bv && bPtr === 0) _renderBrowserHome(bv);
      });
    } else if(res.prereqBlocked) {
      // 「正しいが今は開かない」を無反応にしない（前提不足の明示）
      rbox.innerHTML = `<div class="sbox" style="border-color:rgba(200,169,110,.35);">
        <div class="sbox-label" style="color:var(--gold);">── 照合一致 ──</div>
        <div class="sbox-desc">キーワードは記録と一致しました。ただし参照元の記録が不足しています。<br>復元済みの記録を読み進めてから、もう一度試してください。</div>
      </div>`;
      hideAfter = 6000;
    } else if (/オカエリ|おかえり|お帰り/.test(val)) {
      // ★v3.5 隠し断片の解読語を検索した場合の専用応答（検索では開かない。一行に書く）
      rbox.innerHTML = `<div class="sbox" style="border-color:rgba(200,169,110,.35);">
        <div class="sbox-label" style="color:var(--gold);">── 一致なし ──</div>
        <div class="sbox-desc">📡 それは、検索する言葉ではありません。<br>書き足す言葉です。——あの一行に。</div>
      </div>`;
      hideAfter = 7000;
    } else {
      const hint = _missHint(res.missStreak);
      rbox.innerHTML = `<div class="sbox ng">
        <div class="sbox-label">── 一致なし ──</div>
        <div class="sbox-desc">該当するアーカイブが見つかりません。別のキーワードを試してください。</div>
        ${hint ? `<div class="sbox-desc" style="margin-top:8px;color:var(--red);font-family:var(--mono);font-size:11px;">📡 ${hint}</div>` : ''}
      </div>`;
      if(hint) {
        hideAfter = 7000;
        // 6回目以降は不明送信元からのナッジとして3回ごとにトースト
        if(res.missStreak >= 6 && res.missStreak % 3 === 0) pushNotif('📡', '繧ｿ◆縺薙％??', hint, null);
      }
    }
    setTimeout(() => { if(rbox) rbox.style.display='none'; }, hideAfter);
  }

  /* ── ★ヒントシステム：解放なし検索が続いたとき、不明送信元の口調でナッジ ── */
  function _missHint(streak) {
    if (!streak || streak < 3) return '';
    if (streak < 6) return '…照合失敗が続いています。復元済みの記録を読み直すことを推奨します。';
    // 6回以上：現在地に応じた具体ナッジ
    const SPOKE_HINTS = {
      A: '手記の記録が途切れています。直前の手記を読み直してください。赤い黒塗りは、文脈から元の言葉を推定できます。',

      C: '掲示板の記録が未照合です。ビラと投書の文面を読み直してください。',
      D: '地図の黒塗りが未照合です。欠けた地名を推定してください。',
      E: '電文の解読が未完了です。符号の名前（モールス）で検索すると、道具が見つかります。',
    };
    const sp = KoeOS.getSpokeProgress().find(s => !s.complete);
    if (sp) return SPOKE_HINTS[sp.group] || '';
    if (KoeOS.isRestored('loop') && !KoeOS.isRestored('data_trace'))
      return '最後のファイルの照合語は、文集に挟まれた断片の中にあります。赤い黒塗りは、文脈から元の言葉を推定できます。';
    if (KoeOS.isRestored('receiver_lock') && !KoeOS.isRestored('hidden'))
      return '最後のロックの信号は、モールス読取機と16進変換器の二段で解読できます。';
    if (!KoeOS.isRestored('hidden'))
      return '未読の記録が残っています。復元済みファイルの一覧から、まだ読んでいないものを開いてください。';
    return '';
  }

  const _READ_KEY = 'koe_msgs_read';
  function _getRead() { try { return new Set(JSON.parse(localStorage.getItem(_READ_KEY)||'[]')); } catch { return new Set(); } }
  function _markRead(id) { const s=_getRead(); if(!s.has(id)) { s.add(id); localStorage.setItem(_READ_KEY, JSON.stringify([...s])); } }
  function _visibleThreads() { return THREADS.filter(t => t.gate ? KoeOS.isRestored(t.gate) : true); }

    const done = _getDelivered();
    let changed = false;
    for (const m of STORY_MSGS) {
      if (done.has(m.id)) continue;
      if (m.gate && !KoeOS.isRestored(m.gate)) continue;
      done.add(m.id); changed = true;
      if (animate) pushNotif(m.avatar, m.name, m.preview, m.id);
    }
    if (changed) localStorage.setItem(_DELIVERED_KEY, JSON.stringify([...done]));
  }

  /* ═══════════════════════════════════
     ★v3.4 セクタマップ（タコ躯体図）
  ═══════════════════════════════════ */
  function _renderTako(el) {
    const legs = KoeOS.getLegProgress();
    const isClear = KoeOS.isViewed('epilogue') && (localStorage.getItem('koe_fumi_note')||'').trim() !== '';
    // ★v3.5 TRUE END（隠しページ「返信」閲覧済み）：タコの頭が金色に点灯する
    const isTrue = KoeOS.isViewed('okaeri');

    /* ─ (1) ステータス行 ─ */
    const statusHtml = isClear
      ? `<div class="tako-status" style="color:var(--gold);">損耗率：0.0%　全セクタ固定</div>`
      : `<div class="tako-status">セクタ固定率：<span style="color:var(--gold);">${KoeOS.getFixedPercent()}%</span>　<span style="color:rgba(200,88,88,.6);">損耗進行中</span></div>`;

    /* ─ (2) 小見出し ─ */
    const subheadHtml = `<div class="tako-subhead">── 記録躯体　セクタ配置図</div>`;

    /* ─ (3) SVG躯体図 ─ */
    // 8本の足：中心(160,150)、半径36の胴体から放射状
    // 角度：0°から開始し45°ずつ時計回り（上から右回り）
    // legs の並び順: A=上, B=右上, C=右, D=右下, E=下, spine=左下, shelf=左, core=左上
    const cx = 160, cy = 150, bodyR = 36;
    // 足の角度（度）、時計回り・上から
    const legAngles = [-90, -45, 0, 45, 90, 135, 180, -135]; // 上→右上→右→右下→下→左下→左→左上

    function toRad(deg) { return deg * Math.PI / 180; }

    // 足パスの生成：start から angle 方向に湾曲しながら長さ legLen 伸びる
    // Q カーブで緩やかな渦巻き
    function legPath(angle, legLen) {
      const rad = toRad(angle);
      const perpRad = toRad(angle + 25); // 少し曲げる方向
      // 開始点（胴体縁）
      const sx = cx + bodyR * Math.cos(rad);
      const sy = cy + bodyR * Math.sin(rad);
      // 先端
      const ex = cx + legLen * Math.cos(rad);
      const ey = cy + legLen * Math.sin(rad);
      // 制御点：中間点を少し横にずらして湾曲
      const midLen = legLen * 0.55;
      const qx = cx + midLen * Math.cos(perpRad);
      const qy = cy + midLen * Math.sin(perpRad);
      return { sx, sy, ex, ey, qx, qy };
    }

    // 足上の点（パラメタ t: 0=胴体側, 1=先端）をベジエ曲線で求める
    function bezierPt(p, t) {
      const mt = 1 - t;
      return {
        x: mt*mt*p.sx + 2*mt*t*p.qx + t*t*p.ex,
        y: mt*mt*p.sy + 2*mt*t*p.qy + t*t*p.ey,
      };
    }

    let svgParts = [];
    // 目
    legs.forEach((leg, i) => {
      const angle = legAngles[i];
      const legLen = 125;
      const p = legPath(angle, legLen);
      const pathStr = `M ${p.sx.toFixed(1)} ${p.sy.toFixed(1)} Q ${p.qx.toFixed(1)} ${p.qy.toFixed(1)} ${p.ex.toFixed(1)} ${p.ey.toFixed(1)}`;

      // 足の線の色
      let strokeColor;
      if(isClear || leg.complete) strokeColor = 'var(--gold)';
      else if(leg.revealed) strokeColor = 'rgba(200,169,110,0.35)';
      else strokeColor = 'rgba(255,255,255,0.08)';

      svgParts.push(`<path d="${pathStr}" fill="none" stroke="${strokeColor}" stroke-width="1.5" stroke-linecap="round"/>`);

      // 吸盤（各セクタ）を足に沿って等間隔配置
      const n = leg.sectors.length;
      leg.sectors.forEach((sec, si) => {
        // t=0.15（胴体近く）から t=0.9（先端近く）まで均等割り
        const t = n === 1 ? 0.5 : 0.15 + (si / (n - 1)) * 0.75;
        const pt = bezierPt(p, t);
        const isViewed = isClear || sec.viewed;
        const isUnread = !isClear && sec.restored && !sec.viewed;
        const isLocked = !sec.restored;

        if(isViewed) {
          // グロー円（薄い金）
          svgParts.push(`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="9" fill="rgba(200,169,110,0.15)"/>`);
          svgParts.push(`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="5" fill="var(--gold)"/>`);
        } else if(isUnread) {
          svgParts.push(`<circle class="sector-unread" cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="5" fill="none" stroke="var(--gold)" stroke-width="1.5"/>`);
        } else {
          // 未解放
          svgParts.push(`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="5" fill="#101014" stroke="#2a2a30" stroke-width="1"/>`);
        }
      });

      // 足先ラベル
      const labelStr = leg.revealed ? leg.label : '▒▒▒▒';
      const labelColor = (isClear || leg.complete) ? 'var(--gold)' : (leg.revealed ? 'var(--t2)' : 'var(--t3)');
      // ラベル位置（足先より少し先、画面端に収まるよう調整）
      const labelRad = toRad(angle);
      let lx = cx + (legLen + 14) * Math.cos(labelRad);
      let ly = cy + (legLen + 14) * Math.sin(labelRad);
      // テキストアンカー調整
      let anchor = 'middle';
      const normAngle = ((angle % 360) + 360) % 360;
      if(normAngle > 200 && normAngle < 340) anchor = 'end';
      else if(normAngle > 20 && normAngle < 160) anchor = 'start';
      // 画面端クランプ（viewBox 0 0 320 340）
      lx = Math.max(14, Math.min(306, lx));
      ly = Math.max(10, Math.min(334, ly));
      svgParts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-family="IBM Plex Mono,monospace" font-size="9" fill="${labelColor}" dominant-baseline="middle">${labelStr}</text>`);
    });

    // 胴体（足の根元を覆うよう最後に描く）。目は胴体の塗りに隠れないよう、さらに後に描く
    // ★v3.5 TRUE END時は頭（胴体＋目）が金色に点灯する
    const headFill   = isTrue ? 'rgba(200,169,110,0.22)' : '#0d0d10';
    const headStroke = isTrue ? 'var(--gold)' : 'rgba(200,169,110,0.25)';
    const eyeFill    = isTrue ? 'var(--gold)' : 'none';
    const eyeStroke  = isTrue ? 'var(--gold)' : 'rgba(200,169,110,0.5)';
    const bodySvg = `<g class="${isTrue ? 'tako-head-true' : ''}">`
      + `<circle cx="${cx}" cy="${cy}" r="${bodyR}" fill="${headFill}" stroke="${headStroke}" stroke-width="1.5"/>`
      + `<circle cx="${cx-12}" cy="${cy-6}" r="3" fill="${eyeFill}" stroke="${eyeStroke}" stroke-width="1.2"/>`
      + `<circle cx="${cx+12}" cy="${cy-6}" r="3" fill="${eyeFill}" stroke="${eyeStroke}" stroke-width="1.2"/>`
      + `</g>`;

    const completeNote = isTrue
      ? `<div class="tako-complete-note">── 躯体、応答。声は、帰ってきた。</div>`
      : (isClear ? `<div class="tako-complete-note">── 全セクタ、固定されました。</div>` : '');
    const svgClass = isClear ? 'tako-complete-svg' : '';

    const svgHtml = `
      <div class="tako-svg-wrap">
        <svg class="${svgClass}" viewBox="0 0 320 340" width="300" height="318" xmlns="http://www.w3.org/2000/svg">
          ${svgParts.join('\n          ')}
          ${bodySvg}
        </svg>
      </div>
      ${completeNote}`;

    /* ─ (4) 足の一覧 ─ */
    let listHtml = '<div class="tako-list">';
    legs.forEach((leg, i) => {
      const headerLabel = leg.revealed ? leg.label : '▒▒▒▒';
      const dotsArr = leg.sectors.map(sec => {
        if(isClear || sec.viewed) return `<span style="color:var(--gold);">●</span>`;
        if(sec.restored && !sec.viewed) return `<span class="sector-unread" style="color:var(--gold);">◌</span>`;
        return `<span style="color:var(--t3);">○</span>`;
      });
      const dotsHtml = dotsArr.join('');
      const fixedCnt = isClear ? leg.total : leg.fixed;
      const headerClass = leg.revealed ? 'tako-leg-header' : 'tako-leg-header dimmed';
      const headerColor = (isClear || leg.complete) ? 'color:var(--gold);' : '';

      listHtml += `<div class="tako-leg-row" onclick="_takoToggleLeg(this)">
        <div class="${headerClass}" style="${headerColor}">
          <span style="flex:1;">${headerLabel}</span>
          <span style="font-size:10px;color:var(--t3);">${fixedCnt}/${leg.total}</span>
          <span style="margin-left:8px;font-size:10px;">${dotsHtml}</span>
          <span style="margin-left:6px;color:var(--t3);font-size:12px;" class="tako-toggle-arrow">›</span>
        </div>
        <div class="tako-leg-sectors" data-leg-idx="${i}">`;

      leg.sectors.forEach(sec => {
        if(isClear || sec.viewed) {
          listHtml += `<div class="tako-sector-item"><span style="color:var(--gold);">●</span><span style="color:var(--t1);">${sec.title}</span></div>`;
        } else if(sec.restored && !sec.viewed) {
          listHtml += `<div class="tako-sector-item" style="cursor:pointer;" onclick="event.stopPropagation();Shell.open('browser');setTimeout(()=>Shell.bNavigate('${sec.id}'),80);">
            <span class="sector-unread" style="color:var(--gold);">◌</span>
            <span style="color:var(--t1);">${sec.title}</span>
            <span style="color:var(--t3);font-size:10px;margin-left:4px;">─ 未読</span>
          </div>`;
        } else {
          listHtml += `<div class="tako-sector-item"><span style="color:var(--t3);">▒</span><span style="color:var(--t3);">▒▒▒▒▒▒</span></div>`;
        }
      });

      listHtml += `</div></div>`;
    });
    listHtml += '</div>';

    /* ─ (6) 添え書き ─ */
    const footHtml = `<div class="tako-foot">閲覧された記録は固定されます。読まれていない記録から、先に壊れていきます。</div>`;

    el.innerHTML = `<div class="tako-wrap">${statusHtml}${subheadHtml}${svgHtml}${listHtml}${footHtml}</div>`;
  }

  /* セクタマップ：足の一覧行の開閉トグル */
  window._takoToggleLeg = function(row) {
    const sectors = row.querySelector('.tako-leg-sectors');
    const arrow   = row.querySelector('.tako-toggle-arrow');
    if(!sectors) return;
    const isOpen = sectors.classList.toggle('open');
    if(arrow) arrow.textContent = isOpen ? '⌄' : '›';
  };

  /* ═══════════════════════════════════
     デバッグパネル
  ═══════════════════════════════════ */
  function openDebug() {
    const content = document.getElementById('acontent');
    const footer  = document.getElementById('afooter');

    const old = document.getElementById('bbar-wrap');
    if(old) old.remove();
    content.style.display = 'block';
    content.style.flexDirection = '';
    content.style.overflow = 'auto';

    footer.style.display = 'flex';
    footer.innerHTML = `
      <button onclick="Shell.open('history')" style="
        flex:1;background:var(--s2);border:1px solid var(--bd);
        border-radius:10px;padding:10px;font-family:var(--mono);font-size:11px;
        color:var(--t2);letter-spacing:.06em;cursor:pointer;
      ">‹ 履歴に戻る</button>`;

    const pages    = KoeOS.PAGES;
    const restored = pages.filter(p => KoeOS.isRestored(p.id));
    const locked   = pages.filter(p => !KoeOS.isRestored(p.id));
    const total    = pages.filter(p => p.locked).length;
    const pct      = KoeOS.getProgressPercent();

    const phaseLabel = {1:'第1層', 2:'第2層', 3:'第3層', 0:'常時公開'};

    // ★v3.1 解析アプリのインストール状態
    const toolRows = KoeOS.TOOL_APPS.map(a => {
      const on = KoeOS.isInstalled(a.id);
      return `
        <div style="display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);">
          <span style="flex-shrink:0;">${a.icon}</span>
          <span style="flex:1;color:var(--t1);font-size:11px;">${a.name}</span>
          <span style="color:${on?'var(--green)':'var(--t3)'};font-size:10px;">${on?'済':'未'}</span>
          <span onclick="_devToggleTool('${a.id}')" style="
            color:var(--blue);font-size:10px;cursor:pointer;
            border:1px solid rgba(90,143,212,.3);border-radius:6px;padding:2px 8px;
          ">${on?'削除':'導入'}</span>
        </div>`;
    }).join('');

    content.innerHTML = `
      <div style="padding:16px;font-family:var(--mono);font-size:11px;color:var(--t2);line-height:1.9;">

        <div style="color:var(--blue);letter-spacing:.12em;margin-bottom:14px;">── DEV PANEL</div>

        <div style="background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px;">
          <div style="color:var(--t3);letter-spacing:.1em;font-size:10px;margin-bottom:8px;">PROGRESS</div>
          <div style="color:var(--gold);font-size:16px;margin-bottom:4px;">${pct}%</div>
          <div style="color:var(--t3);">復元済み：${restored.length} / ${total}</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">
          <button onclick="_devUnlockAll()" style="
            background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.25);
            border-radius:8px;padding:10px;color:var(--gold);cursor:pointer;
            font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:left;
          ">▸ 全ページを一括解放</button>
          <button onclick="_devUnlockPhase(1)" style="
            background:var(--s2);border:1px solid var(--bd);
            border-radius:8px;padding:10px;color:var(--t2);cursor:pointer;
            font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:left;
          ">▸ 第1層のみ解放（スポークA〜E）</button>
          <button onclick="_devUnlockPhase(2)" style="
            background:var(--s2);border:1px solid var(--bd);
            border-radius:8px;padding:10px;color:var(--t2);cursor:pointer;
            font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:left;
          ">▸ 第2層まで解放</button>
          <button onclick="_devSetClear()" style="
            background:var(--s2);border:1px solid var(--bd);
            border-radius:8px;padding:10px;color:var(--t2);cursor:pointer;
            font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:left;
          ">▸ クリア状態にする（追記ED・全閲覧済み）</button>
          <button onclick="_devSetTrueEnd()" style="
            background:var(--s2);border:1px solid var(--bd);
            border-radius:8px;padding:10px;color:var(--t2);cursor:pointer;
            font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:left;
          ">▸ TRUE END状態にする（タコの頭点灯）</button>
          <button onclick="_devReset()" style="
            background:var(--red-d);border:1px solid rgba(200,88,88,.22);
            border-radius:8px;padding:10px;color:var(--red);cursor:pointer;
            font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:left;
          ">▸ 全データをリセット（要確認）</button>
        </div>

        <!-- ★v3.1 解析アプリ強制インストール/アンインストール -->
        <div style="color:var(--t3);letter-spacing:.1em;font-size:10px;margin-bottom:6px;">TOOL APPS</div>
        <div style="background:var(--s2);border:1px solid var(--bd);border-radius:8px;margin-bottom:12px;overflow:hidden;">
          ${toolRows}
        </div>

        <div style="color:var(--t3);letter-spacing:.1em;font-size:10px;margin-bottom:6px;">RESTORED (${restored.length})</div>
        <div style="background:var(--s2);border:1px solid var(--bd);border-radius:8px;margin-bottom:12px;overflow:hidden;">
          ${restored.length === 0
            ? '<div style="padding:10px 12px;color:var(--t3);font-size:10px;">なし</div>'
            : restored.map(p => `
              <div style="
                display:flex;align-items:center;gap:8px;
                padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);
                cursor:pointer;
              " onclick="Shell.open('browser');setTimeout(()=>Shell.bNavigate('${p.id}'),80);">
                <span style="flex-shrink:0;">${p.icon}</span>
                <span style="flex:1;color:var(--t1);font-size:11px;">${p.title}</span>
                <span style="color:var(--t3);font-size:10px;">${phaseLabel[p.phase]||''}</span>
              </div>`).join('')
          }
        </div>

        <div style="color:var(--t3);letter-spacing:.1em;font-size:10px;margin-bottom:6px;">LOCKED (${locked.length})</div>
        <div style="background:var(--s2);border:1px solid var(--bd);border-radius:8px;overflow:hidden;">
          ${locked.length === 0
            ? '<div style="padding:10px 12px;color:var(--gold);font-size:10px;">全ページ解放済み</div>'
            : locked.map(p => `
              <div style="
                display:flex;align-items:center;gap:8px;
                padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);
                cursor:pointer;
              " onclick="_devUnlockOne('${p.id}')">
                <span style="flex-shrink:0;opacity:.4;">${p.icon}</span>
                <span style="flex:1;color:var(--t3);font-size:11px;">${p.title}</span>
                <span style="color:var(--blue);font-size:10px;">解放</span>
              </div>`).join('')
          }
        </div>

      </div>`;
  }

  window._devUnlockAll = () => {
    KoeOS.PAGES.forEach(p => KoeOS.markRestored(p.id));
    Shell.openDebug();
  };
  window._devUnlockPhase = (maxPhase) => {
    KoeOS.PAGES.filter(p => p.phase <= maxPhase).forEach(p => KoeOS.markRestored(p.id));
    Shell.openDebug();
  };
  window._devUnlockOne = (id) => {
    KoeOS.markRestored(id);
    const src = `pages/${id}.js`;
    if (!document.querySelector(`script[data-page="${src}"]`)) {
      loadPageScript(src).then(() => Shell.openDebug());
    } else {
      Shell.openDebug();
    }
  };
  // ★v3.1 解析アプリ強制トグル
  window._devToggleTool = (id) => {
    if(KoeOS.isInstalled(id)) KoeOS.uninstallApp(id);
    else {
      KoeOS.installApp(id);
      loadToolScript(`tools/${id}.js`);
    }
    Shell.renderToolGrid();
    Shell.openDebug();
  };
  // ★v3.5 実ブラウザテスト支援：クリア状態／TRUE END状態をワンタップで再現
  window._devSetClear = () => {
    KoeOS.PAGES.filter(p => p.locked && p.id !== 'okaeri').forEach(p => { KoeOS.markRestored(p.id); KoeOS.markViewed(p.id); });
    try {
      localStorage.setItem('koe_fumi_note', '猫塚清治と蛸川小蘭は、ここにいた。');
      localStorage.removeItem('koe_true_end');
    } catch {}
    Shell.openDebug();
  };
  window._devSetTrueEnd = () => {
    KoeOS.PAGES.filter(p => p.locked).forEach(p => { KoeOS.markRestored(p.id); KoeOS.markViewed(p.id); });
    try {
      localStorage.setItem('koe_fumi_note', 'おかえりなさい。');
      localStorage.setItem('koe_true_end', '1');
    } catch {}
    Shell.openDebug();
  };
  window._devReset = () => {
    if(confirm('全データ（進捗・履歴・キーワード）をリセットします。よろしいですか？')) {
      KoeOS.resetAll();
      location.reload();
    }
  };

  return { boot, open, closeApp, goHome, closeMsgView, openThread,
           bNavigate, bBack, bFwd, doSearch, clearHistory, pushNotif, openDebug,
           renderToolGrid, openTool, installTool, setSearchAndFocus };
})();


/* ═══════════════════════════════════════
   PAGE_CONTENT / MSG_THREADS / TOOL_UI
   各ページは pages/*.js、解析アプリは tools/*.js で個別定義
═══════════════════════════════════════ */
const PAGE_CONTENT = {};
const MSG_THREADS  = {};
const TOOL_UI      = {};   // ★v3.1 解析アプリUI辞書

const ALWAYS_LOAD = [
  'pages/archive_about.js',
  'pages/soran_intro.js',   // MSG_THREADS（メッセージスレッド）として動作。PAGES 登録不要
];

function loadPageScript(src) {
  return new Promise(resolve => {
    if (document.querySelector(`script[data-page="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.dataset.page = src;
    s.onload = resolve;
    s.onerror = resolve;
    document.head.appendChild(s);
  });
}

/* ★v3.1 解析アプリ（tools/*.js）の動的ロード */
function loadToolScript(src) {
  return new Promise(resolve => {
    if (document.querySelector(`script[data-tool="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.dataset.tool = src;
    s.onload = resolve;
    s.onerror = resolve;
    document.head.appendChild(s);
  });
}

async function loadAlwaysPages() {
  for (const src of ALWAYS_LOAD) await loadPageScript(src);
}

async function loadRestoredPages() {
  const restored = KoeOS.getRestored();
  for (const id of restored) {
    await loadPageScript(`pages/${id}.js`);
  }
}

/* ★v3.1 インストール済み解析アプリのスクリプトを復元時にロード */
async function loadInstalledTools() {
  const installed = KoeOS.getInstalled();
  for (const id of installed) {
    await loadToolScript(`tools/${id}.js`);
  }
}

/* ── 起動 ── */
window.addEventListener('DOMContentLoaded', async () => {
  await loadAlwaysPages();
  await loadRestoredPages();
  await loadInstalledTools();   // ★v3.1
  Shell.boot();
});
</script>
