<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="蛸川小蘭の自作OS。タコ型端末のデスクトップ（試作）。">
<meta name="robots" content="noindex">
<title>KORAN OS — ようこそ</title>
<script src="koran-os.js"></script>
<style>
  :root{
    --desk1:#0f2e33; --desk2:#0a1d21;
    --win:#f2efe8; --win-ink:#23211d; --win-sub:#7a756a;
    --title1:#274b52; --title2:#162e33;
    --task:#101f23; --task-line:#2b4a51;
    --amber:#b97f1f; --teal:#1f7a6d;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"MS Gothic",monospace;
    --sans:"MS UI Gothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--sans); color:#eef3f1; overflow:hidden;
    background:
      radial-gradient(90% 70% at 80% 10%, rgba(64,150,150,.25) 0%, transparent 60%),
      radial-gradient(70% 60% at 15% 85%, rgba(30,110,110,.28) 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px),
      linear-gradient(160deg, var(--desk1), var(--desk2));
    user-select:none; -webkit-user-select:none;
  }
  #desktop{position:fixed; inset:0 0 46px 0; overflow:hidden;}
  #taskbar{
    position:fixed; left:0; right:0; bottom:0; height:46px;
    background:var(--task); border-top:1px solid var(--task-line);
    display:flex; align-items:stretch; gap:6px; padding:0 8px; z-index:200;
    font-family:var(--mono);
  }
  #startbtn{
    display:flex; align-items:center; gap:8px; background:#1a3439; color:#ffd9a8;
    border:1px solid #33565d; border-radius:6px; margin:6px 0; padding:0 14px;
    font-family:var(--mono); font-size:13px; letter-spacing:.1em; cursor:pointer;
  }
  #startbtn:active{transform:translateY(1px);}
  #tasks{flex:1; display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none;}
  #tasks::-webkit-scrollbar{display:none;}
  .taskbtn{
    white-space:nowrap; background:#182c31; color:#cfe0dc; border:1px solid #2c4a51;
    border-radius:6px; font-size:11px; padding:6px 10px; cursor:pointer; font-family:var(--mono);
  }
  .taskbtn.active{background:#274b52; color:#fff; border-color:#4d7a83;}
  #clock{margin:6px 0; padding:0 12px; display:flex; flex-direction:column; justify-content:center;
    border:1px solid #2c4a51; border-radius:6px; font-size:11px; color:#9fb8b4; text-align:right; line-height:1.5;}
  #clock b{color:#e8ece7; font-size:12px;}
  #clock .blink{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* デスクトップアイコン */
  #icons{position:absolute; top:14px; left:14px; display:flex; flex-direction:column; gap:16px; z-index:5;}
  @media (pointer:coarse), (max-width:560px){
    #icons{flex-direction:row; top:10px; left:10px; right:10px; overflow-x:auto; padding-bottom:4px;}
  }
  .dicon{width:86px; text-align:center; cursor:pointer; padding:6px 2px; border:1px solid transparent; border-radius:6px; position:relative;}
  .dicon.sel{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25);}
  .dicon .glyph{font-size:34px; line-height:1; filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));}
  .dicon .cap{font-size:11px; margin-top:5px; line-height:1.5; text-shadow:0 1px 4px #000;}
  .dicon .hint{display:inline-block; font-size:9px; background:#b97f1f; color:#fff; border-radius:8px; padding:0 7px; margin-top:3px; font-family:var(--mono);}
  .dicon .bdg{position:absolute; top:0; right:6px; background:#b97f1f; color:#fff; font-family:var(--mono);
    font-size:10px; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    padding:0 4px; border:1.5px solid #0a1d21;}

  /* ウィンドウ */
  .win{
    position:absolute; background:var(--win); color:var(--win-ink);
    border:1px solid #0a0f11; border-radius:8px 8px 6px 6px;
    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px #3c5a61;
    display:none; flex-direction:column; overflow:hidden; min-width:0;
  }
  .win.open{display:flex;}
  .win.focus{box-shadow:0 22px 60px rgba(0,0,0,.65), 0 0 0 1px #6fa3ab;}
  .win.min{display:none;}
  .titlebar{
    background:linear-gradient(180deg, var(--title1), var(--title2));
    color:#f2f6f5; display:flex; align-items:center; gap:8px;
    padding:7px 8px 7px 12px; font-size:12.5px; cursor:default; flex-shrink:0;
  }
  .titlebar .ticon{font-size:14px;}
  .titlebar .t{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.03em;}
  .titlebar .btns{display:flex; gap:4px;}
  .titlebar .btns button{
    width:30px; height:22px; border:1px solid rgba(255,255,255,.25); border-radius:4px;
    background:rgba(255,255,255,.08); color:#fff; font-size:11px; cursor:pointer; font-family:var(--mono); line-height:1;
  }
  .titlebar .btns button:hover{background:rgba(255,255,255,.2);}
  .titlebar .btns .x:hover{background:#c0392b; border-color:#c0392b;}
  .menubar{display:flex; gap:14px; padding:4px 12px; font-size:11.5px; color:var(--win-sub);
    border-bottom:1px solid #ddd6c8; background:#ece7db; flex-shrink:0;}
  .addrbar{display:flex; gap:6px; align-items:center; padding:6px 10px; font-size:11.5px;
    background:#f7f4ec; border-bottom:1px solid #ddd6c8; font-family:var(--mono); color:#55514a; flex-shrink:0;}
  .addrbar .path{flex:1; background:#fff; border:1px solid #cfc8b8; border-radius:4px; padding:3px 8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .wbody{padding:14px 16px 18px; overflow:auto; font-size:13.5px; line-height:2.0;}
  .wbody.mono{font-family:var(--mono); font-size:12px; background:#10181a; color:#bcd4cf;}
  .statusbar{border-top:1px solid #ddd6c8; background:#ece7db; font-size:10.5px; color:var(--win-sub);
    padding:4px 12px; font-family:var(--mono); flex-shrink:0; letter-spacing:.04em;}

  /* メモ帳 */
  .notepad{background:#fffdf4; border:1px solid #d8d2c2; padding:16px 18px; font-size:13.5px; line-height:2.1;
    box-shadow:inset 0 0 30px rgba(190,170,130,.12);}
  .notepad .date{font-family:var(--mono); font-size:11px; color:var(--win-sub);}
  .notepad .sign{text-align:right; color:#55514a;}

  /* 付箋 */
  .sticky{background:#fff3b0; border:1px solid #e0cf7a; padding:10px 12px; font-size:12px; line-height:1.9;
    transform:rotate(-.6deg); box-shadow:0 4px 10px rgba(0,0,0,.18); color:#4d4420; margin:0 0 12px;}

  /* フォルダ一覧 */
  .folders{display:grid; gap:8px; margin-top:10px;}
  @media(min-width:560px){.folders{grid-template-columns:1fr 1fr;}}
  .folder{border:1px solid #cfc8b8; border-radius:6px; background:#fff; padding:9px 11px;}
  .folder.unread{border:2px solid var(--amber); background:#fffaf0;}
  .folder .fh{display:flex; align-items:center; gap:7px; font-weight:700; font-size:13px;}
  .folder .tag{margin-left:auto; font-family:var(--mono); font-size:10px; padding:1px 8px; border-radius:10px; border:1px solid #bbb; color:#777;}
  .folder.unread .tag{border-color:var(--amber); color:var(--amber); animation:blink 1.6s steps(1) infinite; font-weight:700;}
  .folder.read .tag{border-color:var(--teal); color:var(--teal);}
  .folder.extwait{border:2px dotted var(--amber); background:#f7f5ee;}
  .folder.extwait .tag{border-color:var(--amber); color:var(--amber); font-weight:700;}
  .filebtn{display:block; width:100%; text-align:left; margin-top:7px; background:#f4f1ea; border:1px solid #d8d2c2;
    border-radius:5px; padding:7px 10px; font-size:12.5px; cursor:pointer; line-height:1.7; color:var(--win-ink); font-family:var(--sans);}
  .filebtn .st{font-family:var(--mono); font-size:10px; color:#8a857d; display:block;}
  .filebtn.new .st{color:var(--amber); font-weight:700;}
  .filebtn.done .st{color:var(--teal);}
  .filebtn:disabled{opacity:.6; cursor:default;}

  /* マネージャ */
  .actq{background:var(--title1); color:#ffd9a8; border-radius:6px; padding:9px 14px; font-size:12.5px;
    letter-spacing:.04em; margin-bottom:10px;}
  .actq .q{font-family:var(--mono); font-size:9px; letter-spacing:.2em; color:#9fb8b4; display:block; margin-bottom:2px;}
  .mgr-next{border:2px solid var(--amber); background:#fffaf0; border-radius:6px; padding:12px 14px; margin-bottom:10px;}
  .mgr-next .q{font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--amber); margin-bottom:4px;}
  .mgr-next .t{font-size:16px; font-weight:700;}
  .mgr-next button{margin-top:10px; width:100%; padding:11px; font-size:14px; font-weight:700; cursor:pointer;
    background:var(--title1); color:#fff; border:none; border-radius:6px; letter-spacing:.08em;}
  .mgr-log{font-family:var(--mono); font-size:11px; color:#3f6b64; line-height:1.9;}

  /* 文書ビューア */
  .doc-kind{font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--win-sub); margin-bottom:4px;}
  .doc-title{font-size:17px; font-weight:700; margin:0 0 10px;}
  .doc-body{background:#fff; border:1px solid #d8d2c2; padding:14px 16px; font-size:13.5px; line-height:2.05; white-space:pre-wrap; font-family:var(--sans);}
  .doc-btns{display:flex; gap:8px; margin-top:12px;}
  .doc-btns button{flex:1; padding:11px; font-size:13px; border-radius:6px; cursor:pointer; border:1px solid #c9c2b2; background:#f4f1ea;}
  .doc-btns .primary{background:#14131a; color:#f3efe6; border-color:#14131a; font-weight:700;}

  /* 写真・地図・外部照合 */
  .doc-photo{width:100%; display:block; border-radius:6px; border:1px solid #d8d2c2; background:#111;}
  .doc-imgbroken{padding:40px 10px; text-align:center; background:#111; color:#555; font-family:var(--mono); font-size:11px; letter-spacing:.2em; border-radius:6px;}
  .zoombox{margin-top:10px; background:#130b0d; border:1px solid rgba(200,88,88,.35); border-radius:6px;
    padding:12px 14px; font-family:var(--mono); font-size:12px; line-height:2; color:#e8ece7;}
  .zoombox .z-h{font-size:9px; color:#8a857d; letter-spacing:.15em; margin-bottom:4px;}
  .extbox{margin:0 0 10px; background:#10181a; border:1px solid #33565d; border-radius:6px;
    padding:12px 14px; font-family:var(--mono); font-size:11.5px; line-height:2; color:#bcd4cf;}
  .extbox .q{font-size:10px; letter-spacing:.18em; color:#e0b46a; margin-bottom:4px;}
  .extbox .ok{color:#7fd4c1;}
  #dz-map{width:100%; height:auto; display:block; background:#e9e3d1; border:1px solid #cfc8b8; border-radius:6px;}
  .mapspot{cursor:pointer;}
  .mapmsg{margin-top:8px; font-family:var(--mono); font-size:11px; color:#3f6b64; line-height:1.9;}
  .mapmsg.bad{color:#a03a3a;}
  .mapmsg.good{color:#1f7a6d; font-weight:700;}

  /* タコ */
  .tako-box{text-align:center; background:linear-gradient(180deg,#0e2226,#0b1b1f); border-radius:6px; padding:8px 4px 2px; margin-bottom:4px;}
  svg.tako{width:100%; max-width:330px; height:auto;}
  .tako-arm{cursor:pointer;}
  .tako-arm .limb{fill:none; stroke:#c65a64; stroke-width:24;}
  .tako-arm[data-state="undiscovered"] .limb{stroke:#3d5457; stroke-dasharray:6 5;}
  .tako-arm[data-state="undiscovered"] .sucker{fill:none;}
  .tako-arm[data-state="has-unread"] .limb{stroke:#e08a7a; animation:armPulse 1.6s ease infinite;}
  @keyframes armPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .tako-arm[data-state="read"] .limb{stroke:#b05560;}
  .tako-arm[data-state="external-wait"] .limb{stroke:#c9a227; stroke-dasharray:10 6;}
  .tako-arm text{font-family:var(--mono); font-size:9px; fill:#9fb8b4;}

  /* トースト（機械通知） */
  #toasts{position:fixed; right:10px; bottom:56px; display:flex; flex-direction:column; gap:8px; z-index:300; max-width:min(330px, 90vw);}
  .toast{background:#0d1517; border:1px solid #33565d; border-left:4px solid var(--amber); color:#cfe0dc;
    border-radius:6px; padding:9px 12px; font-family:var(--mono); font-size:11px; line-height:1.8;
    box-shadow:0 8px 24px rgba(0,0,0,.5); animation:slideIn .3s ease;}
  @keyframes slideIn{from{transform:translateX(20px); opacity:0;}to{transform:none; opacity:1;}}

  /* スタートメニュー */
  #startmenu{position:fixed; left:8px; bottom:52px; width:270px; background:var(--win); color:var(--win-ink);
    border:1px solid #0a0f11; border-radius:8px; box-shadow:0 18px 50px rgba(0,0,0,.6); z-index:250; display:none; overflow:hidden;}
  #startmenu.open{display:block;}
  #startmenu .sm-h{background:linear-gradient(180deg,var(--title1),var(--title2)); color:#ffd9a8; font-family:var(--mono);
    font-size:11px; letter-spacing:.15em; padding:10px 14px;}
  #startmenu button{display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:none; border:none;
    padding:11px 14px; font-size:13px; cursor:pointer; color:var(--win-ink); font-family:var(--sans);}
  #startmenu button:hover{background:#e3eefe;}
  #startmenu .sm-f{border-top:1px solid #ddd6c8; padding:8px 14px; font-size:9.5px; color:var(--win-sub); font-family:var(--mono); line-height:1.8;}

  /* 起動画面 */
  #boot{position:fixed; inset:0; background:#060d0e; z-index:500; display:flex; align-items:center; justify-content:center; font-family:var(--mono);}
  #boot.hide{display:none;}
  #boot .in{text-align:center; width:min(340px, 84vw);}
  #boot .logo{font-size:26px; letter-spacing:.3em; color:#e8ece7; margin-bottom:6px;}
  #boot .sub{font-size:10px; letter-spacing:.2em; color:#5f7d79; margin-bottom:20px;}
  #boot .bar{height:8px; border:1px solid #33565d; border-radius:5px; overflow:hidden;}
  #boot .bar i{display:block; height:100%; width:0; background:#7fd4c1; transition:width .2s;}
  #boot .lines{font-size:10px; color:#5f7d79; margin-top:14px; line-height:2; min-height:44px;}

  /* ログオフ */
  #logoff{position:fixed; inset:0; background:#04080a; z-index:500; display:none; align-items:center; justify-content:center; font-family:var(--mono);}
  #logoff.on{display:flex;}
  #logoff .l-msg{text-align:center; font-size:13px; letter-spacing:.3em; color:#9fb8b4; line-height:2.6;}
  #logoff .l-sub{font-size:10px; letter-spacing:.15em; color:#5f7d79;}
  #logoff .blink{animation:blink 1s steps(1) infinite;}
</style>
</head>
<body>

<div id="boot">
  <div class="in">
    <div class="logo">🐙 KORAN</div>
    <div class="sub">KORAN SYSTEM / build 08.16</div>
    <div class="bar"><i id="bootbar"></i></div>
    <div class="lines" id="bootlines">author: 蛸川小蘭<br>storage: 8-arm distributed archive</div>
  </div>
</div>

<div id="logoff"><div class="l-msg">LOGOFF<span class="blink">…</span><br><span class="l-sub">セッションを切断しました</span></div></div>

<div id="desktop">
  <div id="icons"></div>
  <div id="wins"></div>
</div>

<div id="startmenu">
  <div class="sm-h">🐙 KORAN OS</div>
  <div id="sm-items"></div>
  <div class="sm-f">build 08.16 ｜ 試作（資料3件）<br>本作はフィクションです。</div>
</div>

<div id="taskbar">
  <button id="startbtn">🐙 スタート</button>
  <div id="tasks"></div>
  <div id="clock"><b>09:04<span class="blink">:</span>32</b><span>1973/09/12（停止中）</span></div>
</div>

<div id="toasts"></div>

<script>
(function(){
  'use strict';
  const winsEl = document.getElementById('wins');
  const tasksEl = document.getElementById('tasks');
  const iconsEl = document.getElementById('icons');
  const openWins = {};   // id -> {el, minimized}
  let zTop = 10;
  let cascade = 0;
  const finePointer = window.matchMedia && window.matchMedia('(pointer:fine)').matches;

  /* ---------- 小さな部品 ---------- */
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(iso){
    try{
      const d = new Date(iso);
      return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} かため済み`;
    }catch{ return 'かため済み'; }
  }
  function toast(msg){
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, 4200);
    setTimeout(() => el.remove(), 4700);
  }

  /* ---------- ぬいぐるみ風のタコSVG ----------
     小蘭が現代で持ち込んだ当時の姿＝新品の布地。
     大きな黒目・小さな笑み・ずんぐりした足・足先の光る端子。 */
  function takoSVG(size){
    // 8本の足：頭の下に放射状。ずんぐり短め。state別に色分け（classで制御）
    const arms = KoranOS.ARMS.map((arm, i) => {
      const a = (Math.PI * 2 * i) / 8 + Math.PI / 8;
      const x1 = 160 + Math.cos(a) * 48, y1 = 182 + Math.sin(a) * 30;
      const x2 = 160 + Math.cos(a) * 96, y2 = 182 + Math.sin(a) * 66;
      const mx = 160 + Math.cos(a) * 74, my = 182 + Math.sin(a) * 52 + 9;
      const st = KoranOS.armState(arm.id);
      // 第8足の先に端子の灯り（回収写真の通り）
      const port = (i === 7)
        ? `<rect x="${(x2-9).toFixed(1)}" y="${(y2-6).toFixed(1)}" width="18" height="12" rx="2" fill="#3a2c22" stroke="#201612" stroke-width="1.5"/>` +
          `<rect x="${(x2-6).toFixed(1)}" y="${(y2-3.5).toFixed(1)}" width="12" height="7" rx="1" fill="#f5a742">` +
          `<animate attributeName="opacity" values="1;.5;1" dur="2s" repeatCount="indefinite"/></rect>`
        : `<ellipse class="sucker" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" rx="5" ry="6.5" fill="#e9b7b7" opacity=".9"/>`;
      return `<g class="tako-arm" data-state="${st}" data-arm="${arm.id}">` +
        `<path class="limb" d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" stroke-width="24" stroke-linecap="round"/>` +
        port +
        `<text x="${x2.toFixed(1)}" y="${(y2+20).toFixed(1)}" text-anchor="middle">${i+1}</text>` +
        `</g>`;
    }).join('');
    return `<svg class="tako" viewBox="60 40 200 235" role="img" aria-label="たこらん">` +
      arms +
      // 頭（新品の赤い布地）
      `<ellipse cx="160" cy="130" rx="60" ry="64" fill="#c65a64" stroke="#8a3a42" stroke-width="3"/>` +
      // 目（大きな黒目・上目づかい）
      `<ellipse cx="137" cy="126" rx="11" ry="15" fill="#2a2226"/>` +
      `<ellipse cx="183" cy="126" rx="11" ry="15" fill="#2a2226"/>` +
      `<circle cx="140.5" cy="120" r="3.6" fill="#fff" opacity=".95"/>` +
      `<circle cx="186.5" cy="120" r="3.6" fill="#fff" opacity=".95"/>` +
      // 小さな笑み
      `<path d="M151,156 q9,8 18,0" fill="none" stroke="#5e2f36" stroke-width="2.5" stroke-linecap="round"/>` +
      `</svg>`;
  }

  /* ---------- ウィンドウ管理 ---------- */
  function winSize(){
    const small = window.innerWidth < 560;
    return small
      ? { w: window.innerWidth - 16, x: 8, yBase: 86 }
      : { w: 460, x: 150, yBase: 40 };
  }
  function openWin(id, title, icon, menu, addr, bodyHTML, statusHTML){
    if (openWins[id]) {
      const o = openWins[id];
      o.el.classList.remove('min');
      o.minimized = false;
      focusWin(id);
      return o.el;
    }
    const s = winSize();
    const el = document.createElement('div');
    el.className = 'win';
    el.style.width = Math.min(s.w, window.innerWidth - 16) + 'px';
    el.style.maxHeight = (window.innerHeight - 46 - 100) + 'px';
    const off = (cascade % 4) * 26;
    el.style.left = Math.max(8, Math.min(s.x + off, window.innerWidth - el.style.width.replace('px','') - 8)) + 'px';
    el.style.top = (s.yBase + off) + 'px';
    cascade++;
    el.innerHTML =
      `<div class="titlebar"><span class="ticon">${icon}</span><span class="t">${esc(title)}</span>` +

        if (act === 'min') minWin(id);

    const bar = el.querySelector('.titlebar');

      bar.style.cursor = 'move';

        if (e.target.tagName === 'BUTTON') return;
        const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
        bar.setPointerCapture(e.pointerId);
        const move = (ev) => {
          el.style.left = Math.max(-40, Math.min(ev.clientX - sx, window.innerWidth - 80)) + 'px';
          el.style.top = Math.max(0, Math.min(ev.clientY - sy, window.innerHeight - 120)) + 'px';
        };
        const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
        bar.addEventListener('pointermove', move);
        bar.addEventListener('pointerup', up);
      });
    }

    const body = `<div style="padding:6px 2px 2px;line-height:2.1;">読み取りセッションを切断します。<br>` +
      `かためた記録は残ります。</div>` +
      `<div class="doc-btns"><button data-act="back">もどる</button>` +
      `<button class="primary" data-act="off">切断する</button></div>`;
    const el = openWin('logoff-c', 'セッションの切断', '🔌', null, null, body, null);
    el.querySelector('[data-act="back"]').addEventListener('click', () => closeWin('logoff-c'));
    el.querySelector('[data-act="off"]').addEventListener('click', () => {
      closeWin('logoff-c');
      document.getElementById('logoff').classList.add('on');
      setTimeout(() => { window.location.href = 'remote.html?session=closed'; }, 1500);
    });
  }
  document.getElementById('startbtn').addEventListener('click', (e) => {
    e.stopPropagation();
    refreshStartMenu();
    document.getElementById('startmenu').classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#startmenu') && !e.target.closest('#startbtn'))
      document.getElementById('startmenu').classList.remove('open');
  });

  /* ---------- 起動 ---------- */
  function boot(){
    renderIcons(); refreshStartMenu();
    const bar = document.getElementById('bootbar');
    const lines = document.getElementById('bootlines');
    let w = 0;
    const t = setInterval(() => {
      w += 25;
      bar.style.width = Math.min(w, 100) + '%';
      if (w >= 100) {
        clearInterval(t);
        lines.innerHTML += '<br>read session … <b style="color:#e0b46a;">OK</b>';
        setTimeout(() => {
          document.getElementById('boot').classList.add('hide');
          const first = !KoranOS.isLaunched();
          KoranOS.markLaunched();
          // 窓は自動で開かない。開くのはプレイヤーに任せ、バッジと通知だけ出す。
          renderIcons();
          if (first) setTimeout(() => toast('NEW FRAGMENT: 1 ｜ たこつぼにあります'), 700);
        }, 400);
      }
    }, 220);
    document.getElementById('boot').addEventListener('click', () => {
      clearInterval(t);
      document.getElementById('boot').classList.add('hide');
    });
  }
  boot();
})();
</script>
</body>
</html>
